<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Agendar Tarefa</title>
</head>
<body>
<div class="container">
    <h1 class="center">Tarefas</h1>
    <p class="center">Organizando seu dia!!</p>

    <ul class="center">
        <li>
            <i class="small material-icons">event_note</i>
            Tarefas Importantes!!
        </li>
        <li>Não esqueça !!!</li>
    </ul>

    <p>Título: </p><input type="text" class="campoTitulo" />
    <p>Observações: </p> <input type="text" class="campoObs" />

    <p>Prioridade: </p>
    <select class="campoPrioridade browser-default">
        <option value="Baixa">Baixa</option>
        <option value="Média">Média</option>
        <option value="Alta">Alta</option>
    </select>

    <div class="divBotao">
        <a id="botao" class="btn-floating btn-large waves-effect waves-light blue">
            <i class="material-icons">add</i>
        </a>
    </div>
    <section class="tarefas">
        <table class="highlight">
            <thead>
                <tr>
                    <th>Tarefas</th>
                    <th>Observações</th>
                    <th>Prioridade</th>
                    <th>Concluir</th>
                    <th>Apagar</th>
                </tr>
            </thead>

            <tbody id="tabelaTarefas">
            </tbody>
        </table>
    </section>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
